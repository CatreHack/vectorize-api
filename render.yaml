services:
  - type: web
    name: vectorize-api
    runtime: python
    plan: free
    pythonVersion: "3.13.5"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: BACKGROUND_REMOVER_ENGINE
        value: floodfill
      - key: VECTORIZER_ENGINE
        value: contour
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ALLOWED_ORIGINS
        value: "https://catrehack.github.io"
