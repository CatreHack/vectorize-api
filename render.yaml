services:
  - type: web
    name: vectorize-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: STORAGE_DIR
        value: "./storage"
