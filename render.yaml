services:
  - type: web
    name: vectorize-api
    runtime: python
    plan: free
    pythonVersion: "3.13.5"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      # Motores de alta calidad. Los presets por modo (foto/logo/dibujo)
      # viven en app/config.py; estas variables solo eligen la
      # implementacion concreta de cada etapa.
      - key: BACKGROUND_REMOVER_ENGINE
        value: rembg
      - key: REMBG_MODEL
        value: u2netp
      - key: VECTORIZER_ENGINE
        value: vtracer
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ALLOWED_ORIGINS
        value: "https://catrehack.github.io"
